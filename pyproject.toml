[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "metria"
version = "0.1.0"
description = "Metria Stress Test — status-first evidence protocol CLI"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = [
  "jsonschema>=4.20",
  "PyYAML>=6.0",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
metria = "metria.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["metria*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
